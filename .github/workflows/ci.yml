name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar mypy
        run: pip install mypy

      - name: Type check
        run: mypy calculadora.py historial.py

  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    needs: typecheck

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install pytest

      - name: Ejecutar pruebas
        run: pytest test_calculadora.py test_historial.py -v
