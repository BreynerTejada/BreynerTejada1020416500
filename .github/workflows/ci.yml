name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx con mirror de Docker Hub
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Construir imagen CI con caché
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ci-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ejecutar pruebas
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ci-app pytest test_calculadora.py test_historial.py -v

      - name: Verificar ejecución del programa
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ci-app python calculadora.py
